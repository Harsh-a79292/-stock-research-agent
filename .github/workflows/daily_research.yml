name: Daily Stock Research & Email Delivery

on:
  schedule:
    # 9:00 AM IST = 03:30 UTC daily
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  daily-research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Gmail OAuth credentials
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          mkdir -p credentials
          if [ -n "$GMAIL_CREDENTIALS_JSON" ]; then
            printf '%s' "$GMAIL_CREDENTIALS_JSON" > credentials/gmail_credentials.json
          fi
          if [ -n "$GMAIL_TOKEN_JSON" ]; then
            printf '%s' "$GMAIL_TOKEN_JSON" > credentials/gmail_token.json
          fi

      - name: Run daily stock research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          DAILY_RESEARCH_TICKERS: ${{ secrets.DAILY_RESEARCH_TICKERS }}
          DAILY_RESEARCH_RECIPIENT: ${{ secrets.DAILY_RESEARCH_RECIPIENT }}
        run: python -m backend.scripts.daily_research
